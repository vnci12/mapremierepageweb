<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Formulaire d'inscription</title>
        <link href="formulaire.css" rel="stylesheet">
    </head>
    <body>
        <form>
            <div>
                <label for="nom">Nom:</labe>
                <!--précision du nom-->
                <input type="text" name="nom" id="nom">
      
                <label for="prenom">Prénom(s):</label>
                <!--précision du pprénom-->
                <input type="text" name="prenom" id="prenom">
            </div>

            <br><br>

            <div>
                <label>Date de naissance:</label>
                <!--choix de la date de naissance-->
                <input type="date" name="dateNaissance" id="dateNaissance">  
      
                <label for="village">Village:</label>
                <!--précision du village-->
                <input type="text" name="village" id="village">
            </div>

            <br><br>
            
            <div>
                <label>Genre:</label>
                <!--choix du sex M/F-->
                <input type="radio" id="sexMasculin" name="sex">
                <label for="sex">Homme</label>
      
                <!--choix du sex F/M-->
                <input type="radio" id="sexFeminin" name="sex">
                <label for="sex">Femme</label>
            </div>
      
            <br><br>
      
            <label>Diciplines:</label>
      
            <input type="checkbox" id="mathematique" name="mathematique">
            <label for="mathematique">Maths</label>
      
            <input type="checkbox" id="français" name="francais">
            <label for="français">Français</label>
      
            <input type="checkbox" id="histoireGeographie" name="histoireGeographie">
            <label for="histoireGeographie">Histoire Géographie</label>
      
            <br><br>
      
            <label for="email">Email</label>
            <input type="text" name="email" id="email">
      
            <br><br>
      
            <input type="submit">
            <br><br>

        </form>
    </body>
</html>
