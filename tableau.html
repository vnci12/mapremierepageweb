<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>tableau</title>
        <link href="tableau.css" rel="stylesheet">
    </head>

    <body>
        <table><!--permet de créer un tableau-->

            <!--tr permet de créer une ligne-->
            <tr>
                <th>Nom</th><!--th permet de créer une en-tête-->
                <th>Prénom</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Anzize</td><!--permet de noter du contenue dans un cellule-->
                <td>Amine</td>
                <td>19</td>
            </tr>
            <tr>
                <td>Farouk</td>
                <td>Abdoul</td>
                <td>25</td>
            </tr>
        </table>
    </body>
</html>
